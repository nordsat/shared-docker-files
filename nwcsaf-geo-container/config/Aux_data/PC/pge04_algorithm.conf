####################################################################
# PGE04 Algorithm configuration - V2015
####################################################################
# IMPORTANT, EACH BLOCK START
# MUST BE SPECIFIED AT A SINGLE LINE
# AND EACH BLOCK END MUST BE AT A SINGLE LINE
#
# i.e.
# <BLOCK NAME>: <BLOCK ID> {
#	block specific data
# };
#
# IF IT IS DEFINED IN ANY OTHER WAY THE CONFIGURATION WILL NOT WORK!
#
# All files given reside in $SAFNWC/import/Aux_data
#
#####################################################################
# GLOBAL_PARAM: These are PGE04 static data that does not change depending
# on algorithm usage, etc.
#
# SUNZEN_ANGLE specifies when to use the daytime or nighttime
# algorithm. If the actual sun zenith angle is less than SUNZEN_ANGLE, the
# daytime algorithm will be used, otherwise the nighttime algorithm
# will be used. So if for example the night algorithm
# should always be used,  SUNZEN_ANGLE can be set to a negative value. 
# It is not recommended (though formally possible) to use the day time
# algorithm for values greater than 80 degrees.

# PROBABILITY_THRESH: if the probability for "no rain" is lower or equal 
# PROBABILITY_THRESH, the pixel will be processed as potentially raining,
# otherwise the probability of rain is set to zero 
#
GLOBAL_PARAM: GLOBALS {
	SUNZEN_ANGLE:		70.0
	PROBABILITY_THRESH:	90
};

#
# Define the different algorithms to be used:
# The BLOCK ID has to be an integer between 0 and 255 to
# be valid, otherwise the result will be unpredicatable
# Each ALGORITHM block must define PROB_DAY and PROB_NIGHT,
# where each attribute points to a filename (including path) giving 
# the Precipitation Index to likelihood mapping.
# It is also possible to expand environment variable into
# the path by using ${ENVIRONMENT_VARIABLE}.
# DAY_FORMULA_COEFF and NIGHT_FORMULA_COEFF: Five coefficients (float)
# expected by the current algorithms, for the computation of the
# Precipitation Index.
# Example(ww tuned coefficients, define algorithm 0 for all cloudtypes in cloud type definition section):
# ALGORITHM: 0 {
#	PROB_DAY:		pge04_msg_PI_day_alg_0.dat
#	PROB_NIGHT:		pge04_msg_PI_night_alg_0.dat
#	DAY_FORMULA_COEFF:	130. -1.17841 0.193517 1.34862 -0.403661 3.2 1.21913 -1.14646 1.0137 -0.729214 0.482047
#	NIGHT_FORMULA_COEFF:	130. -0.808931 -0.660192 -1.3209 0.0 0.0 0.0 0.0 1.56148 -0.146149 0.0
#};
# THE COEFFICIENTS, AS WELL AS THE CONTENT OF THE DATA FILES, SHOULD NOT
# BE CHANGED BY THE USER UNLESS OWN TUNING ACTIVITIES HAVE BEEN PERFORMED! 
#
# Currently the algorithms are valid for the following cloud types:
# ALGORITHM0: derived for all precipitating cloud types (9-14,17-18)
# ALGORITHM1: derived for medium level clouds (CT 09,10)
# ALGORITHM2: derived for opaque high to very high clouds (CT 11-14) 
# ALGORITHM3: derived for thick cirrus (CT 17)
# ALGORITHM3: derived for cirrus over lower clouds (CT 18)
# In the current implementation (v2.0) the coefficients in the PI formular are identical for all algorithms,
# whereas the mapping between PI and precipitation probability can either be configured as 
# cloud type dependent (configuring use of algorithm1-4) or CT independent (algorithm0), as set in block CLOUDTYPE_DEFINITION.
# Algorithms below have been tuned on french gauge data for 2004 and have been independently validated on hungarian gauge data. 
ALGORITHM: 0 {
	PROB_DAY:		pge04_msg_PI_day_alg_0.dat
	PROB_NIGHT:		pge04_msg_PI_night_alg_0.dat
	DAY_FORMULA_COEFF:	130. -1.17841 0.193517 1.34862 -0.403661 3.2 1.21913 -1.14646 1.0137 -0.729214 0.482047
	NIGHT_FORMULA_COEFF:	130. -0.808931 -0.660192 -1.3209 0.0 0.0 0.0 0.0 1.56148 -0.146149 0.0
};
ALGORITHM: 1 {
	PROB_DAY:		pge04_msg_PI_day_alg_1.dat
	PROB_NIGHT:		pge04_msg_PI_night_alg_1.dat
	DAY_FORMULA_COEFF:	230.0 -1.35 -0.63 -2.59 63.79 0.0 -0.40 0.0 -0.92 0.32 1.52
	NIGHT_FORMULA_COEFF:	460.0 -0.90 -0.91 -5.34 0.0 0.0 0.0 0.0 -0.27 0.65 0.0
};
ALGORITHM: 2 {
	PROB_DAY:		pge04_msg_PI_day_alg_2.dat
	PROB_NIGHT:		pge04_msg_PI_night_alg_2.dat
	DAY_FORMULA_COEFF:	230.0 -1.35 -0.63 -2.59 63.79 0.0 -0.40 0.0 -0.92 0.32 1.52
	NIGHT_FORMULA_COEFF:	460.0 -0.90 -0.91 -5.34 0.0 0.0 0.0 0.0 -0.27 0.65 0.0
};
ALGORITHM: 3 {
	PROB_DAY:		pge04_msg_PI_day_alg_3.dat
	PROB_NIGHT:		pge04_msg_PI_night_alg_3.dat
	DAY_FORMULA_COEFF:	230.0 -1.35 -0.63 -2.59 63.79 0.0 -0.40 0.0 -0.92 0.32 1.52
	NIGHT_FORMULA_COEFF:	460.0 -0.90 -0.91 -5.34 0.0 0.0 0.0 0.0 -0.27 0.65 0.0
};
ALGORITHM: 4 {
	PROB_DAY:		pge04_msg_PI_day_alg_4.dat
	PROB_NIGHT:		pge04_msg_PI_night_alg_4.dat
	DAY_FORMULA_COEFF:	230.0 -1.35 -0.63 -2.59 63.79 0.0 -0.40 0.0 -0.92 0.32 1.52
	NIGHT_FORMULA_COEFF:	460.0 -0.90 -0.91 -5.34 0.0 0.0 0.0 0.0 -0.27 0.65 0.0
};


# CLOUDTYPE_DEFINITION:Table defining what cloudtype values that are
# precipitating or not, and which algorithm to use.
# 
#- First column is the cloudtype value, currently there are 21,
# but this table can be expanded with up to 255 different values.
#
#- Second column indicates whether the cloudtype is potentially 
#  precipitating: 0 : probability for no rain 100% assigned apriori,
#  1: potentially raining, go through processing steps
#
#- Third column indicates what algorithm number x should
# be used. The algorithmx must exist as a defined algorithm (see above)

CLOUDTYPE_DEFINITION: CLOUDTYPES {
0     0     0        # Not processed
1     0     0        # Cloud free land
2     0     0        # Cloud free sea
3     0     0        # Snow over land
4     0     0        # Sea ice
5     0     0        # Very low clouds
6     0     0        # Low clouds
7     1     1        # Mid-level clouds: algorithm 1
8     1     2        # High opaque clouds: algorithm 2
9     1     2        # Very high opaque clouds: algorithm 2
10    0     0        # Fractional clouds
11    0     0        # High semitransparent thin clouds
12    0     0        # High semitransparent meanly thick clouds
13    1     3        # High semitransparent thick clouds: algorithm 3
14    1     4        # High semitransparent above low or medium clouds: algorithm 4
15    0     0        # High semitransparent above snow/ice
};